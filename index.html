<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI QA Automation Platform — Demo</title>
<!-- DOMPurify: every dynamic DOM write is sanitized (see setHTML) -->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root{
    --primary:#1677ff; --primary-hover:#4096ff; --primary-active:#0958d9;
    --primary-bg:#e6f4ff; --primary-border:#91caff;
    --success:#52c41a; --success-bg:#f6ffed; --success-border:#b7eb8f;
    --error:#ff4d4f; --error-bg:#fff2f0; --error-border:#ffccc7;
    --warning:#faad14; --warning-bg:#fffbe6; --warning-border:#ffe58f;
    --purple:#722ed1; --purple-bg:#f9f0ff; --purple-border:#d3adf7;
    --cyan:#13c2c2; --cyan-bg:#e6fffb;
    --text:rgba(0,0,0,.88); --text-2:rgba(0,0,0,.65); --text-3:rgba(0,0,0,.45);
    --border:#f0f0f0; --border-2:#d9d9d9; --bg:#f5f5f5; --bg-2:#fafafa; --white:#fff;
    --radius:8px; --radius-sm:6px;
    --shadow:0 1px 2px rgba(0,0,0,.03),0 1px 6px -1px rgba(0,0,0,.02),0 2px 4px rgba(0,0,0,.02);
    --shadow-lg:0 6px 16px rgba(0,0,0,.08),0 3px 6px -4px rgba(0,0,0,.12),0 9px 28px 8px rgba(0,0,0,.05);
    --sidebar-w:232px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);font-size:14px;color:var(--text);background:var(--bg);line-height:1.5715;-webkit-font-smoothing:antialiased}
  a{color:var(--primary);text-decoration:none}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#00000026;border-radius:8px}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---------- Layout ---------- */
  .layout{display:flex;min-height:100vh}
  .sidebar{width:var(--sidebar-w);background:#001529;color:#fff;position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:20}
  .logo{height:56px;display:flex;align-items:center;gap:10px;padding:0 20px;color:#fff;font-weight:600;font-size:15px;border-bottom:1px solid #ffffff14}
  .logo .mark{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#1677ff,#13c2c2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
  .logo small{display:block;font-weight:400;font-size:11px;color:#ffffff73;letter-spacing:.3px}
  .nav{flex:1;padding:8px 0;overflow-y:auto}
  .nav-item{display:flex;align-items:center;gap:12px;height:42px;padding:0 22px;color:#ffffffa6;cursor:pointer;font-size:14px;transition:.15s;border:none;background:none;width:100%;text-align:left}
  .nav-item:hover{color:#fff;background:#ffffff0f}
  .nav-item.active{color:#fff;background:var(--primary)}
  .nav-item .ic{width:18px;text-align:center;font-size:15px}
  .nav-group-label{padding:14px 22px 6px;color:#ffffff40;font-size:11px;text-transform:uppercase;letter-spacing:.6px}
  .sidebar-foot{padding:12px 20px;border-top:1px solid #ffffff14;font-size:12px;color:#ffffff59}

  .main{flex:1;margin-left:var(--sidebar-w);display:flex;flex-direction:column;min-width:0}
  .topbar{height:56px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px;position:sticky;top:0;z-index:10}
  .crumb{color:var(--text-3);font-size:13px}
  .crumb b{color:var(--text);font-weight:500}
  .topbar-spacer{flex:1}
  .select-wrap{position:relative}
  select{appearance:none;border:1px solid var(--border-2);background:var(--white);height:32px;border-radius:var(--radius-sm);padding:0 30px 0 12px;font-family:var(--font);font-size:13px;color:var(--text);cursor:pointer}
  select:hover{border-color:var(--primary)}
  .select-wrap::after{content:"▾";position:absolute;right:10px;top:7px;color:var(--text-3);pointer-events:none;font-size:11px}
  .env-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2)}
  .env-dot{width:7px;height:7px;border-radius:50%;background:var(--success)}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .content{padding:24px;flex:1}

  /* ---------- Typography & headers ---------- */
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:16px;flex-wrap:wrap}
  .page-title{font-size:22px;font-weight:600;color:var(--text)}
  .page-sub{color:var(--text-3);font-size:13px;margin-top:3px;max-width:680px}
  .section-title{font-size:15px;font-weight:600;margin:0 0 14px}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 15px;border-radius:var(--radius-sm);border:1px solid var(--border-2);background:var(--white);color:var(--text);font-size:14px;font-family:var(--font);cursor:pointer;transition:.15s;white-space:nowrap}
  .btn:hover{color:var(--primary);border-color:var(--primary)}
  .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover);color:#fff}
  .btn-sm{height:26px;padding:0 10px;font-size:13px}
  .btn-lg{height:40px;padding:0 22px;font-size:15px}
  .btn-ghost{border-color:transparent;background:transparent}
  .btn-ghost:hover{background:#0000000a;color:var(--primary)}
  .btn-danger{color:var(--error);border-color:var(--error)}
  .btn-danger:hover{background:var(--error);color:#fff;border-color:var(--error)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap}

  /* ---------- Cards ---------- */
  .card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border)}
  .card-pad{padding:20px}
  .grid{display:grid;gap:16px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .kpi{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);padding:18px 20px}
  .kpi .label{color:var(--text-3);font-size:13px;display:flex;align-items:center;gap:7px}
  .kpi .val{font-size:28px;font-weight:600;margin-top:8px;letter-spacing:-.5px}
  .kpi .delta{font-size:12px;margin-top:6px}
  .delta.up{color:var(--success)} .delta.down{color:var(--error)}
  .kpi .ic-badge{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;float:right;margin-top:-2px}

  /* ---------- Tags ---------- */
  .tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:4px;font-size:12px;line-height:1;border:1px solid transparent;white-space:nowrap}
  .tag-blue{color:var(--primary);background:var(--primary-bg);border-color:var(--primary-border)}
  .tag-green{color:#389e0d;background:var(--success-bg);border-color:var(--success-border)}
  .tag-red{color:#cf1322;background:var(--error-bg);border-color:var(--error-border)}
  .tag-orange{color:#d46b08;background:var(--warning-bg);border-color:var(--warning-border)}
  .tag-purple{color:var(--purple);background:var(--purple-bg);border-color:var(--purple-border)}
  .tag-cyan{color:#08979c;background:var(--cyan-bg);border-color:#87e8de}
  .tag-gray{color:var(--text-2);background:var(--bg-2);border-color:var(--border-2)}

  /* ---------- Tables ---------- */
  .tbl-wrap{overflow-x:auto}
  table.tbl{width:100%;border-collapse:collapse;font-size:14px}
  table.tbl th{text-align:left;padding:12px 16px;background:var(--bg-2);color:var(--text-2);font-weight:600;font-size:13px;border-bottom:1px solid var(--border);white-space:nowrap}
  table.tbl td{padding:12px 16px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
  table.tbl tr:last-child td{border-bottom:none}
  table.tbl tbody tr{transition:.12s}
  table.tbl tbody tr.clickable{cursor:pointer}
  table.tbl tbody tr.clickable:hover{background:var(--primary-bg)}
  .mono{font-family:"SF Mono","Roboto Mono",Menlo,Consolas,monospace;font-size:12.5px}
  .cell-id{font-family:"SF Mono",Menlo,monospace;font-size:12.5px;color:var(--primary);font-weight:500}
  .muted{color:var(--text-3)}
  .strong{font-weight:600}

  /* ---------- Toolbar / filters ---------- */
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .search{position:relative;flex:1;min-width:220px;max-width:340px}
  .search input{width:100%;height:32px;border:1px solid var(--border-2);border-radius:var(--radius-sm);padding:0 12px 0 32px;font-family:var(--font);font-size:14px}
  .search input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-bg)}
  .search .si{position:absolute;left:10px;top:7px;color:var(--text-3)}
  .seg{display:inline-flex;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:2px}
  .seg button{border:none;background:none;padding:4px 12px;border-radius:4px;font-size:13px;color:var(--text-2);cursor:pointer;font-family:var(--font)}
  .seg button.active{background:var(--white);color:var(--primary);box-shadow:var(--shadow);font-weight:500}

  /* ---------- Progress / bars ---------- */
  .bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:6px;background:var(--primary)}
  .bar.green > i{background:var(--success)} .bar.orange > i{background:var(--warning)} .bar.red > i{background:var(--error)}
  .ring{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .ring::before{content:"";position:absolute;width:88px;height:88px;background:var(--white);border-radius:50%}
  .ring b{position:relative;font-size:24px;font-weight:600}
  .ring-wrap{position:relative;display:flex;align-items:center;justify-content:center}

  /* mini bar chart */
  .barchart{display:flex;align-items:stretch;gap:10px;height:120px;padding-top:8px}
  .barchart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%}
  .barchart .col .b{width:60%;max-width:30px;background:linear-gradient(180deg,#91caff,#1677ff);border-radius:5px 5px 0 0;position:relative;transition:.3s;min-height:4px}
  .barchart .col .b > span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--text-3)}
  .barchart .col small{color:var(--text-3);font-size:11px}

  /* ---------- Drawer & Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;opacity:0;pointer-events:none;transition:.2s}
  .overlay.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:560px;max-width:94vw;background:var(--white);z-index:101;box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border)}
  .drawer-head h3{font-size:16px;font-weight:600}
  .drawer-body{padding:24px;overflow-y:auto;flex:1}
  .drawer-foot{padding:14px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
  .modal{position:fixed;top:8vh;left:50%;transform:translateX(-50%) scale(.96);width:640px;max-width:94vw;max-height:84vh;background:var(--white);border-radius:var(--radius);z-index:101;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.2s;display:flex;flex-direction:column}
  .modal.open{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1)}
  .modal-head{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .modal-head h3{font-size:16px;font-weight:600}
  .modal-body{padding:24px;overflow-y:auto}
  .modal-foot{padding:14px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
  .x{cursor:pointer;color:var(--text-3);font-size:18px;line-height:1;border:none;background:none;padding:4px;border-radius:5px}
  .x:hover{background:#0000000a;color:var(--text)}

  /* desc list */
  .dl{display:grid;grid-template-columns:140px 1fr;gap:0;font-size:14px}
  .dl dt{color:var(--text-3);padding:8px 0;border-bottom:1px solid var(--border)}
  .dl dd{padding:8px 0;border-bottom:1px solid var(--border)}
  .dl dt:last-of-type,.dl dd:last-of-type{border-bottom:none}

  /* steps */
  .steps{list-style:none}
  .steps li{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--border)}
  .steps li:last-child{border-bottom:none}
  .steps .n{width:22px;height:22px;border-radius:50%;background:var(--primary-bg);color:var(--primary);font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:600}
  .steps .act{flex:1}
  .steps .tgt{font-family:"SF Mono",Menlo,monospace;font-size:12px;color:var(--text-3)}

  /* code */
  pre.code{background:#0d1117;color:#c9d1d9;border-radius:var(--radius);padding:16px 18px;overflow:auto;font-family:"SF Mono","Roboto Mono",Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  pre.code .k{color:#ff7b72} pre.code .s{color:#a5d6ff} pre.code .c{color:#8b949e} pre.code .f{color:#d2a8ff} pre.code .t{color:#7ee787}
  .codebar{display:flex;align-items:center;justify-content:space-between;background:#161b22;color:#8b949e;padding:8px 14px;border-radius:var(--radius) var(--radius) 0 0;font-family:monospace;font-size:12px;border-bottom:1px solid #30363d}
  .codebar + pre.code{border-radius:0 0 var(--radius) var(--radius)}

  /* tabs */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px}
  .tabs button{border:none;background:none;padding:9px 16px;font-size:14px;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;font-family:var(--font);margin-bottom:-1px}
  .tabs button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:500}

  /* toast */
  #toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:10px;align-items:center}
  .toast{background:var(--white);box-shadow:var(--shadow-lg);border-radius:var(--radius);padding:10px 16px;display:flex;align-items:center;gap:10px;font-size:14px;border:1px solid var(--border);animation:tin .25s}
  @keyframes tin{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
  .toast .ti{font-size:16px}
  .toast.success .ti{color:var(--success)} .toast.error .ti{color:var(--error)} .toast.info .ti{color:var(--primary)}

  /* misc */
  .row{display:flex;gap:16px;flex-wrap:wrap}
  .stack{display:flex;flex-direction:column;gap:16px}
  .between{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg-2);border:1px solid var(--border);border-radius:20px;padding:3px 11px;font-size:12px;color:var(--text-2)}
  .note{background:var(--primary-bg);border:1px solid var(--primary-border);border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;color:var(--text-2);display:flex;gap:9px;align-items:flex-start}
  .note.warn{background:var(--warning-bg);border-color:var(--warning-border)}
  .note.purple{background:var(--purple-bg);border-color:var(--purple-border)}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px}
  .field input,.field textarea{width:100%;border:1px solid var(--border-2);border-radius:var(--radius-sm);padding:8px 12px;font-family:var(--font);font-size:14px}
  .field textarea{min-height:74px;resize:vertical}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-bg)}
  .check{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;cursor:pointer;transition:.15s}
  .check:hover{border-color:var(--primary)}
  .check input{margin-top:3px}
  .check .meta{flex:1}
  .check .meta small{color:var(--text-3);display:block;font-size:12px}
  .token-pill{font-family:monospace;font-size:12px;color:var(--text-3)}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-top:10px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .empty{text-align:center;color:var(--text-3);padding:40px}
  .divider{height:1px;background:var(--border);margin:18px 0}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--primary-border);border-top-color:var(--primary);border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* execution center: plans, live console & AI monitor */
  .modal.wide{width:940px}
  .plan-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-3);margin:10px 0}
  .plan-meta b{color:var(--text-2);font-weight:600}
  .console{display:flex;gap:16px;align-items:stretch}
  .console .con-main{flex:1.25;min-width:0;display:flex;flex-direction:column}
  .console .con-ai{flex:1;background:#0d1117;border-radius:8px;display:flex;flex-direction:column;min-width:0;border:1px solid #30363d}
  .con-ai-head{color:#c9d1d9;font-size:12px;font-weight:600;padding:10px 14px;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:7px}
  .con-ai-head .live{margin-left:auto;font-size:11px;color:#7ee787;display:flex;align-items:center;gap:5px}
  .con-ai-head .live::before{content:"";width:7px;height:7px;border-radius:50%;background:#7ee787;animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .con-ai-log{padding:12px 14px;overflow:auto;max-height:48vh;font-family:"SF Mono",Menlo,monospace;font-size:12px;line-height:1.65;color:#c9d1d9;flex:1}
  .ai-line{display:flex;gap:8px;margin-bottom:7px;animation:tin .2s}
  .ai-line .ai-ic{flex-shrink:0}
  .ai-line.ok .ai-ic{color:#7ee787} .ai-line.warn .ai-ic{color:#f0b72f} .ai-line.diag .ai-ic{color:#d2a8ff} .ai-line.fix .ai-ic{color:#56d4dd} .ai-line.info .ai-ic{color:#58a6ff}
  .ai-line.diag,.ai-line.fix{background:#161b22;border-radius:6px;padding:6px 8px;margin-left:-6px;margin-right:-6px}
  .ai-line.diag b,.ai-line.fix b{color:#fff}
  .con-cases{overflow:auto;max-height:48vh;margin-top:4px}
  .con-case{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:7px;margin-bottom:7px;transition:.2s}
  .con-case.running{border-color:var(--primary-border);background:var(--primary-bg)}
  .con-case.fail{border-color:var(--error-border);background:var(--error-bg)}
  .con-case .cid{font-family:"SF Mono",Menlo,monospace;font-size:12px;color:var(--primary);width:122px;flex-shrink:0}
  .con-case .ct{flex:1;font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .report-sec{margin-bottom:18px}
  @media(max-width:760px){.console{flex-direction:column}.con-ai-log,.con-cases{max-height:220px}}
  /* page capture wizard */
  .cap-steps{display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .cap-step{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-3)}
  .cap-step.active{color:var(--primary);font-weight:600}
  .cap-step.done{color:var(--success)}
  .cap-num{width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
  .cap-arrow{color:var(--border-2)}
  .cap-log{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:14px;font-family:"SF Mono",Menlo,monospace;font-size:12px;line-height:1.7;color:#c9d1d9;min-height:200px;max-height:46vh;overflow:auto}
  .radio-row{display:flex;gap:8px;flex-wrap:wrap}
  .radio-card{flex:1;min-width:150px;border:1px solid var(--border-2);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:13px;transition:.15s}
  .radio-card:hover{border-color:var(--primary)}
  .radio-card.sel{border-color:var(--primary);background:var(--primary-bg)}
  .radio-card small{display:block;color:var(--text-3);font-size:11px;margin-top:2px}
  @media(max-width:920px){
    .sidebar{transform:translateX(-100%)} .main{margin-left:0} .kpis{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>

const $=(s,el=document)=>el.querySelector(s);
const esc=(s)=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* All dynamic DOM writes go through DOMPurify (XSS-safe). */
function setHTML(node,html){ node.innerHTML = (window.DOMPurify ? DOMPurify.sanitize(html) : html); }
function render(html){ setHTML($("#content"),html); $("#content").scrollTop=0; }
let CURRENT_PRODUCT="Back Office";

const STATUS_TAG={automated:'tag-green',candidate:'tag-orange',manual:'tag-gray'};
const PRIO_TAG={High:'tag-red',Medium:'tag-orange',Low:'tag-gray'};
const RUN_TAG={passed:'tag-green',failed:'tag-red',running:'tag-blue',queued:'tag-gray'};
const RES_TAG={pass:'tag-green',fail:'tag-red',skip:'tag-gray'};
const SCRIPT_STATUS_TAG={passing:'tag-green',failing:'tag-red',draft:'tag-gray'};
const RISK_TAG={High:'tag-red',Medium:'tag-orange',Low:'tag-gray'};
const STRAT_TAG={testid:'tag-green',role:'tag-blue',label:'tag-cyan',text:'tag-purple',css:'tag-orange'};
const STAB_TAG={High:'tag-green',Med:'tag-orange',Low:'tag-red'};

function tag(text,cls){return `<span class="tag ${cls}">${esc(text)}</span>`;}
function filteredCases(){return CURRENT_PRODUCT==="all"?DB.cases:DB.cases.filter(c=>c.product===CURRENT_PRODUCT);}
function filteredPages(){return CURRENT_PRODUCT==="all"?DB.pages:DB.pages.filter(p=>p.product===CURRENT_PRODUCT);}

/* ---- overlays ---- */
function openDrawer(title,bodyHTML,footHTML){
  const d=$("#drawer");
  setHTML(d,`<div class="drawer-head"><h3>${esc(title)}</h3><button class="x" data-act="close">✕</button></div>
    <div class="drawer-body">${bodyHTML}</div>${footHTML?`<div class="drawer-foot">${footHTML}</div>`:''}`);
  $("#overlay").classList.add("open"); d.classList.add("open");
}
function openModal(title,bodyHTML,footHTML){
  const m=$("#modal"); m.classList.remove("wide");
  setHTML(m,`<div class="modal-head"><h3>${esc(title)}</h3><button class="x" data-act="close">✕</button></div>
    <div class="modal-body">${bodyHTML}</div>${footHTML?`<div class="modal-foot">${footHTML}</div>`:''}`);
  $("#overlay").classList.add("open"); m.classList.add("open");
}
function openModalWide(title,bodyHTML,footHTML){ openModal(title,bodyHTML,footHTML); $("#modal").classList.add("wide"); }
function closeOverlays(){["#overlay","#drawer","#modal"].forEach(s=>$(s).classList.remove("open"));}
function toast(msg,type="success"){
  const ic={success:"✓",error:"✕",info:"ⓘ"}[type]||"✓";
  const t=document.createElement("div");t.className=`toast ${type}`;
  setHTML(t,`<span class="ti">${ic}</span><span>${esc(msg)}</span>`);
  $("#toasts").appendChild(t);
  setTimeout(()=>{t.style.opacity=0;t.style.transition=".3s";setTimeout(()=>t.remove(),300);},2600);
}

function kpiCard(label,val,delta,dir,bg,color,ic){
  return `<div class="kpi">
    <div class="ic-badge" style="background:${bg};color:${color}">${ic}</div>
    <div class="label">${label}</div>
    <div class="val">${val}</div>
    <div class="delta ${dir}">${dir==='up'?'↑':'↓'} ${delta}</div>
  </div>`;
}
function composition(){
  const cs=DB.cases, tot=cs.length;
  const a=cs.filter(c=>c.status==='automated').length,cd=cs.filter(c=>c.status==='candidate').length,m=cs.filter(c=>c.status==='manual').length;
  const seg=(n,cls,lbl,bar)=>`<div class="between" style="margin-bottom:8px"><span>${tag(lbl,cls)}</span><span class="strong">${n}</span></div><div class="bar ${bar}"><i style="width:${(n/tot*100).toFixed(0)}%"></i></div>`;
  return `<div class="stack" style="gap:14px">
    ${seg(a,'tag-green','Automated','green')}
    ${seg(cd,'tag-orange','Candidate','orange')}
    ${seg(m,'tag-gray','Manual','')}
  </div>`;
}
function attentionItem(ic,color,title,sub,act,arg){
  return `<div class="check" style="cursor:pointer;margin:0" data-act="${act}" data-a="${arg}">
    <span style="color:${color};font-size:16px">${ic}</span>
    <div class="meta"><div class="strong">${esc(title)}</div><small>${esc(sub)}</small></div>
    <span class="muted">→</span></div>`;
}

/* ============================================================
   PAGE CAPTURE WIZARD  (Register / capture a page)
   ============================================================ */
let CAPSTATE=null;
function inferStrat(loc){
  if(loc.includes('getByTestId'))return{strat:'testid',stab:'High'};
  if(loc.includes('getByRole'))return{strat:'role',stab:loc.includes('table')?'Med':'High'};
  if(loc.includes('getByLabel')||loc.includes('getByPlaceholder'))return{strat:'label',stab:'High'};
  if(loc.includes('getByText'))return{strat:'text',stab:'Med'};
  return{strat:'css',stab:'Low'};
}
function openCapture(){
  CAPSTATE={step:1,mode:'new',src:null,captured:null,
    data:{product:(CURRENT_PRODUCT==='all'?'Back Office':CURRENT_PRODUCT),name:'Reports',route:'/reports',env:'staging',login:true,method:'live'}};
  renderCap();
}
function recapture(id){
  const p=DB.pages.find(x=>x.id===id);
  CAPSTATE={step:1,mode:'recapture',src:p,captured:null,
    data:{product:p.product,name:p.id.replace('PAGE-','').replace(/-/g,' '),route:p.route,env:'staging',login:true,method:'live'}};
  renderCap();
}
function capStepper(){
  const labels=['Target','Capture','Review','Page Object & save'];
  return `<div class="cap-steps">${labels.map((l,i)=>{const n=i+1;const cls=n<CAPSTATE.step?'done':(n===CAPSTATE.step?'active':'');
    return `<div class="cap-step ${cls}"><span class="cap-num">${n<CAPSTATE.step?'✓':n}</span>${l}</div>`;}).join('<span class="cap-arrow">→</span>')}</div>`;
}
function renderCap(){ ({1:capStep1,2:capStep2,3:capStep3,4:capStep4}[CAPSTATE.step])(); }
const CAP_TITLE=()=> (CAPSTATE.mode==='recapture'?'Re-capture page · ':'Register / capture page · ');

function capStep1(){
  const d=CAPSTATE.data;
  const methodCard=(v,t,s)=>`<div class="radio-card ${d.method===v?'sel':''}" data-act="capMethod" data-a="${v}"><b>${t}</b><small>${s}</small></div>`;
  openModalWide(CAP_TITLE()+'Target',`
    ${capStepper()}
    <div class="row" style="gap:12px">
      <div class="field" style="flex:1;margin-bottom:12px"><label>Product</label><div class="select-wrap" style="width:100%"><select id="capProduct" style="width:100%">${['Back Office','Online Order','POS','KDS','Kiosk'].map(x=>`<option ${d.product===x?'selected':''}>${x}</option>`).join('')}</select></div></div>
      <div class="field" style="flex:1;margin-bottom:12px"><label>Page name</label><input id="capName" value="${esc(d.name)}" placeholder="e.g. Reports"></div>
    </div>
    <div class="row" style="gap:12px">
      <div class="field" style="flex:1;margin-bottom:12px"><label>Route / URL path</label><input id="capRoute" value="${esc(d.route)}" placeholder="/reports"></div>
      <div class="field" style="flex:1;margin-bottom:12px"><label>Environment</label><div class="select-wrap" style="width:100%"><select id="capEnv" style="width:100%">${['staging','qa','dev'].map(e=>`<option ${d.env===e?'selected':''}>${e}</option>`).join('')}</select></div></div>
    </div>
    <label class="check" style="cursor:pointer"><input type="checkbox" id="capLogin" ${d.login?'checked':''}><div class="meta"><b>Page requires login</b><small>Restore a saved auth state before navigating (so protected pages capture correctly).</small></div></label>
    <div id="capAuth" style="display:${d.login?'block':'none'};padding-left:8px">
      <div class="field" style="margin-bottom:6px"><label>Auth profile</label><div class="select-wrap" style="width:100%"><select id="capAuthProfile" style="width:100%"><option>qa_user@staging (Admin)</option><option>qa_viewer@staging (Viewer)</option></select></div></div>
    </div>
    <div class="section-title" style="font-size:14px;margin-top:8px">Capture method</div>
    <div class="radio-row">
      ${methodCard('live','Live capture','Headless browser visits the route')}
      ${methodCard('paste','Paste HTML','Use a saved HTML snapshot')}
      ${methodCard('test','From a test run','Reuse a passing run’s page state')}
    </div>
    <div class="note" style="margin-top:14px"><span>ⓘ</span><div>Capture extracts an <b>ARIA snapshot</b> + <b>Locator Map</b> + <b>DOM hash</b> — never full HTML — to keep AI context cheap. <b>FR-PAGE-001/002/006 · NFR-COST-001</b></div></div>
  `,`<button class="btn" data-act="close">Cancel</button><button class="btn btn-primary" data-act="capStartCapture">Start capture →</button>`);
}
function capMethod(v){ CAPSTATE.data.method=v; capReadStep1(); renderCap(); }
function capReadStep1(){
  const g=id=>{const e=$(id);return e?e.value:null;};
  const d=CAPSTATE.data;
  if($("#capProduct"))d.product=g("#capProduct");
  if($("#capName"))d.name=$("#capName").value.trim()||d.name;
  if($("#capRoute"))d.route=$("#capRoute").value.trim()||d.route;
  if($("#capEnv"))d.env=g("#capEnv");
  if($("#capLogin"))d.login=$("#capLogin").checked;
}
function capStartCapture(){ capReadStep1(); CAPSTATE.step=2; renderCap(); runCaptureStream(); }

function capStep2(){
  openModalWide(CAP_TITLE()+'Capturing',`
    ${capStepper()}
    <div class="between" style="margin-bottom:8px"><span class="strong">${esc(CAPSTATE.data.route)} <span class="muted">· ${CAPSTATE.data.env}</span></span><span id="capStatus">${tag('capturing','tag-blue')}</span></div>
    <div class="bar" style="margin-bottom:12px"><i id="capBar" style="width:0%;transition:.4s"></i></div>
    <div class="cap-log" id="capLog"></div>
  `,`<button class="btn" data-act="close">Cancel</button>`);
}
function runCaptureStream(){
  const d=CAPSTATE.data;
  const steps=[
    ['▸',`Launching headless Chromium on ${d.env}…`],
    ['▸',`Navigating to ${d.route} …`],
    ...(d.login?[['▸','Restoring auth state (qa_user@staging)…']]:[]),
    ['▸','Waiting for network idle…'],
    ['✓','Accessibility tree captured'],
    ['✓','Derived locators (preferring testid → role → label)'],
    ['✓','DOM hash computed'],
    ['🧠','AI quality scan: scoring locator stability…'],
    ['✓','Capture complete.']
  ];
  let i=0;const log=[];
  const tick=()=>{
    if(!$("#capLog"))return;
    log.push(steps[i]);
    setHTML($("#capLog"),log.map(([ic,t])=>`<div style="margin-bottom:6px"><span style="color:${ic==='✓'?'#7ee787':ic==='🧠'?'#d2a8ff':'#58a6ff'}">${ic}</span> ${esc(t)}</div>`).join(''));
    const bar=$("#capBar");if(bar)bar.style.width=Math.round((i+1)/steps.length*100)+'%';
    $("#capLog").scrollTop=$("#capLog").scrollHeight;
    i++;
    if(i<steps.length){setTimeout(tick,420);}
    else{ buildCaptured(); setTimeout(()=>{ if($("#capLog")){CAPSTATE.step=3;renderCap();} },650); }
  };
  setTimeout(tick,350);
}
function buildCaptured(){
  const raw = CAPSTATE.mode==='recapture' ? CAPSTATE.src.map : [
    ['Reports.dateRange',"getByLabel('Date range')"],
    ['Reports.applyBtn',"getByRole('button', { name: 'Apply filters' })"],
    ['Reports.resultsTable',"getByRole('table', { name: 'Report results' })"],
    ['Reports.exportBtn',"getByRole('button', { name: 'Export CSV' })"],
    ['Reports.firstRowAmount',"locator('table tbody tr:first-child td:nth-child(3)')"]
  ];
  CAPSTATE.captured={
    aria: CAPSTATE.mode==='recapture' ? CAPSTATE.src.aria : ['heading: Reports','combobox: Date range','button: Apply filters','table: Report results','button: Export CSV'],
    map: raw.map(([key,loc])=>({key,loc,...inferStrat(loc)})),
    hash: CAPSTATE.mode==='recapture' ? 'c4f1…9b' : 'c4f1…9b',
    changed: CAPSTATE.mode==='recapture'
  };
}
function capStep3(){
  const c=CAPSTATE.captured, brittle=c.map.filter(m=>m.stab==='Low');
  openModalWide(CAP_TITLE()+'Review',`
    ${capStepper()}
    ${CAPSTATE.mode==='recapture'?`<div class="note warn" style="margin-bottom:14px"><span>⚠</span><div><b>Drift detected:</b> DOM hash ${CAPSTATE.src.hash} → <b>${c.hash}</b>. Review changes before overwriting — dependent scripts may need updates. <b>FR-PAGE-005</b></div></div>`:''}
    <div class="section-title" style="font-size:14px">ARIA snapshot <span class="token-pill">(~${c.aria.length*6} tokens vs ~3.4k full HTML · ~98% saved)</span></div>
    <pre class="code">${c.aria.map(a=>`<span class="t">- </span>${esc(a)}`).join('\n')}</pre>
    <div class="section-title" style="font-size:14px;margin-top:16px">Locator Map <span class="muted" style="font-weight:400">— ${c.map.length} elements, strategy &amp; stability scored</span></div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Semantic name</th><th>Locator</th><th>Strategy</th><th>Stability</th></tr></thead>
      <tbody>${c.map.map(m=>`<tr>
        <td class="mono" style="font-size:12px;color:var(--primary)">${esc(m.key)}</td>
        <td class="mono" style="font-size:11.5px">${esc(m.loc)}</td>
        <td>${tag(m.strat,STRAT_TAG[m.strat])}</td>
        <td>${tag(m.stab,STAB_TAG[m.stab])}</td>
      </tr>`).join('')}</tbody>
    </table></div>
    <div class="note ${brittle.length?'warn':''}" style="margin-top:14px"><span>${brittle.length?'⚠':'✓'}</span><div>${brittle.length
      ? `<b>AI quality scan:</b> ${brittle.length} element${brittle.length>1?'s':''} rely on a brittle <b>CSS fallback</b> (<span class="mono">${brittle.map(b=>b.key.split('.').pop()).join(', ')}</span>). Recommend adding a <span class="mono">data-testid</span> so the locator survives layout changes.`
      : '<b>AI quality scan:</b> all locators use stable strategies. No brittle selectors detected.'}</div></div>
    <div class="muted" style="font-size:12px;margin-top:10px">DOM hash: <span class="mono">${c.hash}</span></div>
  `,`<button class="btn" data-act="capBack" data-a="1">← Back</button><button class="btn btn-primary" data-act="capNext" data-a="4">Next: Page Object →</button>`);
}
function capPageObjectCode(){
  const cls=CAPSTATE.data.name.replace(/\s+/g,'')+'Page';
  const props=CAPSTATE.captured.map.map(m=>`  <span class="f">${m.key.split('.').pop()}</span> = this.page.${m.loc};`).join('\n');
  return `<span class="k">import</span> { Page } <span class="k">from</span> <span class="s">'@playwright/test'</span>;

<span class="k">export class</span> <span class="f">${cls}</span> {
  <span class="k">constructor</span>(<span class="k">private</span> page: Page) {}
${props}
  <span class="k">async</span> open() { <span class="k">await</span> this.page.goto(<span class="s">'${CAPSTATE.data.route}'</span>); }
}`;
}
function capStep4(){
  const po='products/'+CAPSTATE.data.product.toLowerCase().replace(/\s+/g,'')+'/pages/'+CAPSTATE.data.name.replace(/\s+/g,'')+'Page.ts';
  openModalWide(CAP_TITLE()+'Page Object & save',`
    ${capStepper()}
    <label class="check" style="cursor:pointer"><input type="checkbox" id="capGenPO" checked><div class="meta"><b>Generate a Page Object</b><small>Create a POM class from the Locator Map so scripts call business methods, not selectors. <b>FR-PAGE-004</b></small></div></label>
    <div id="capPOPreview">
      <div class="codebar" style="margin-top:6px"><span>${esc(po)}</span><span>TypeScript</span></div>
      <pre class="code">${capPageObjectCode()}</pre>
    </div>
    <div class="note purple" style="margin-top:14px"><span>♻</span><div>On save, the profile (route, ARIA snapshot, Locator Map, Page Object path, DOM hash) is stored in the registry and becomes reusable AI context — no re-extraction needed next time. <b>FR-PAGE-001 · FR-AI-004</b></div></div>
  `,`<button class="btn" data-act="capBack" data-a="3">← Back</button><button class="btn btn-primary" data-act="capSave">${CAPSTATE.mode==='recapture'?'Save & overwrite profile':'Save to registry'}</button>`);
}
function capNext(n){ CAPSTATE.step=+n; renderCap(); }
function capBack(n){ CAPSTATE.step=+n; renderCap(); }
function capSave(){
  const d=CAPSTATE.data, c=CAPSTATE.captured;
  const id=CAPSTATE.mode==='recapture'?CAPSTATE.src.id:'PAGE-'+d.name.toUpperCase().replace(/\s+/g,'-');
  const po='products/'+d.product.toLowerCase().replace(/\s+/g,'')+'/pages/'+d.name.replace(/\s+/g,'')+'Page.ts';
  const obj={id,route:d.route,product:d.product,po,hash:c.hash,drift:false,aria:c.aria,map:c.map.map(m=>[m.key,m.loc])};
  const existing=DB.pages.find(p=>p.id===id);
  if(existing)Object.assign(existing,obj); else DB.pages.push(obj);
  CAPSTATE=null; closeOverlays();
  toast((existing?'Updated ':'Registered ')+id+' in Page Registry','success');

function runPlan(id){ startConsole(DB.plans.find(p=>p.id===id)); }
function startConsole(plan){
  RUNSIM={plan, cases:plan.caseIds.map(cid=>({id:cid,title:(DB.cases.find(c=>c.id===cid)||{}).title||cid,status:'queued',dur:null})), ai:[], done:false};
  openModalWide('Live run · '+plan.name, consoleHTML(), '');
  pushAI('info','Monitor initialized. Watching '+RUNSIM.cases.length+' cases on '+plan.env+' · '+plan.worker+'.');
  setTimeout(()=>stepRun(0),650);
}
function consoleHTML(){
  return `<div class="muted" style="font-size:12px;margin-bottom:10px">Executed by Playwright workers — the AI monitor observes the stream and diagnoses anomalies in real time. <b>FR-EXEC-MON</b></div>
  <div class="console">
    <div class="con-main">
      <div class="between" style="margin-bottom:8px"><span class="strong">Progress</span><span id="conStatus">${tag('running','tag-blue')}</span></div>
      <div class="bar"><i id="conBar" style="width:0%;transition:.4s"></i></div>
      <div class="con-cases" id="conCases" style="margin-top:12px"></div>
    </div>
    <div class="con-ai">
      <div class="con-ai-head">✦ AI Monitor &amp; Diagnosis <span class="live" id="conLive">live</span></div>
      <div class="con-ai-log" id="conAI"></div>
    </div>
  </div>
  <div id="conFoot" style="margin-top:14px;display:flex;justify-content:flex-end;gap:10px"></div>`;
}
function renderConsole(){
  const cc=$("#conCases"); if(!cc)return;
  setHTML(cc, RUNSIM.cases.map(c=>{
    const icon=c.status==='pass'?'<span style="color:#52c41a">✓</span>':c.status==='fail'?'<span style="color:#ff4d4f">✕</span>':c.status==='running'?'<span class="spin"></span>':'<span class="muted">◷</span>';
    return `<div class="con-case ${c.status}"><span>${icon}</span><span class="cid">${c.id}</span><span class="ct">${esc(c.title)}</span><span class="muted" style="font-size:12px">${c.dur||(c.status==='running'?'running…':'queued')}</span></div>`;
  }).join(""));
  const done=RUNSIM.cases.filter(c=>c.status==='pass'||c.status==='fail').length;
  const bar=$("#conBar"); if(bar)bar.style.width=Math.round(done/RUNSIM.cases.length*100)+'%';
}
function renderAI(){
  const log=$("#conAI"); if(!log)return;
  setHTML(log, RUNSIM.ai.map(l=>`<div class="ai-line ${l.lvl}"><span class="ai-ic">${({info:'▸',ok:'✓',warn:'⚠',diag:'🧠',fix:'💡'}[l.lvl])}</span><span>${l.html}</span></div>`).join(""));
  log.scrollTop=log.scrollHeight;
}
function pushAI(lvl,html){ if(!RUNSIM)return; RUNSIM.ai.push({lvl,html}); renderAI(); }
function stepRun(i){
  if(!RUNSIM||!$("#conCases"))return;
  if(i>=RUNSIM.cases.length){ finishRun(); return; }
  const c=RUNSIM.cases[i];
  c.status='running'; renderConsole();
  setTimeout(()=>{
    if(!$("#conCases"))return;
    const fails = c.id==='BO-LOGIN-003';
    c.status=fails?'fail':'pass'; c.dur=(3+Math.random()*3).toFixed(1)+'s'; renderConsole();
    if(fails){
      pushAI('warn',`<b>${c.id}</b> failed — <span style="color:#ff7b72">TimeoutError</span> locating <b>Login.signInButton</b>. Cross-referencing trace + Locator Map…`);
      setTimeout(()=>pushAI('diag',`<b>Diagnosis:</b> the element detaches after the “Account locked” banner renders. Root cause = <b>stale locator (Script bug)</b>, not a product defect. Confidence 0.86.`),520);
      setTimeout(()=>pushAI('fix',`<b>Suggested fix:</b> await <code>getByText('Account locked')</code>, then assert Sign In hidden. Skipping flaky retry to save ~6s.`),1080);
      setTimeout(()=>stepRun(i+1),1650);
    }else{
      const notes={'BO-LOGIN-001':'Login happy-path nominal — no baseline drift.','BO-LOGIN-002':'Negative-path rejection correct.','BO-USER-001':'User CRUD nominal; no perf regression.'};
      pushAI('ok',`<b>${c.id}</b> passed (${c.dur}). ${notes[c.id]||'Nominal.'}`);
      setTimeout(()=>stepRun(i+1),700);
    }
  },850);
}
function finishRun(){
  RUNSIM.done=true;
  const pass=RUNSIM.cases.filter(c=>c.status==='pass').length, fail=RUNSIM.cases.filter(c=>c.status==='fail').length;
  const status=fail?'failed':'passed';
  const live=$("#conLive"); if(live)live.remove();
  const st=$("#conStatus"); if(st)setHTML(st,tag(status,RUN_TAG[status]));
  pushAI('info',`Run complete — ${pass}/${RUNSIM.cases.length} passed.${fail?` ${fail} issue isolated &amp; explained.`:' All green.'} Report ready.`);
  const runId='RUN-'+(runSeq++);
  const results=RUNSIM.cases.map(c=>({case:c.id,script:(DB.cases.find(x=>x.id===c.id)||{}).script||null,status:c.status,dur:c.dur,
    err:c.status==='fail'?'TimeoutError: locator.click: Login.signInButton not found after lockout banner rendered':undefined,
    cat:c.status==='fail'?'Script bug':undefined}));
  DB.runs.unshift({id:runId,env:RUNSIM.plan.env,status,total:RUNSIM.cases.length,pass,fail,skip:0,started:'just now',dur:'~'+(RUNSIM.cases.length*4)+'s',by:'Plan: '+RUNSIM.plan.name,results,planId:RUNSIM.plan.id});
  RUNSIM.plan.last={status,at:'just now',runId};
  const foot=$("#conFoot"); if(foot)setHTML(foot,`<button class="btn" data-act="close">Close</button><button class="btn btn-primary" data-act="openReport" data-a="${runId}">✦ Generate AI report</button>`);
}

/* ---- AI execution report ---- */
function openReport(runId){
  const r=DB.runs.find(x=>x.id===runId)||DB.runs[0];
  const results=r.results&&r.results.length?r.results:Array.from({length:r.total},(_,i)=>({case:'CASE-'+(i+1),status:i<r.pass?'pass':(i<r.pass+r.fail?'fail':'skip')}));
  const fails=results.filter(x=>x.status==='fail');
  const rate=Math.round(r.pass/r.total*100);
  const summary=fails.length
    ? `<b>${r.pass}/${r.total} passed (${rate}%).</b> ${fails.length} failure isolated to the <b>Authentication</b> module and classified as a <b>script bug</b> — no product regressions detected. Suite health: good. Estimated fix effort: <b>low</b> (single locator wait).`
    : `<b>${r.pass}/${r.total} passed (100%).</b> No failures, no flaky retries, no baseline drift. Suite is healthy and safe to gate the release.`;
  const body=`
    <div class="between" style="margin-bottom:10px"><div><span class="cell-id">${r.id}</span> <span class="muted">· ${r.env} · ${r.started}</span></div>${tag(r.status,RUN_TAG[r.status])}</div>
    <div class="note purple report-sec"><span>✦</span><div><b>Executive summary (AI-generated)</b><br>${summary}</div></div>
    <div class="report-sec">
      <div class="section-title" style="font-size:14px">Results</div>
      <div class="row" style="gap:8px">
        <div class="card card-pad" style="flex:1;text-align:center;padding:10px"><div class="muted" style="font-size:12px">Pass rate</div><div class="strong" style="font-size:18px">${rate}%</div></div>
        <div class="card card-pad" style="flex:1;text-align:center;padding:10px;background:#f6ffed"><div class="muted" style="font-size:12px">Passed</div><div class="strong" style="font-size:18px;color:#389e0d">${r.pass}</div></div>
        <div class="card card-pad" style="flex:1;text-align:center;padding:10px;background:${r.fail?'#fff2f0':'#fff'}"><div class="muted" style="font-size:12px">Failed</div><div class="strong" style="font-size:18px;color:#ff4d4f">${r.fail}</div></div>
        <div class="card card-pad" style="flex:1;text-align:center;padding:10px"><div class="muted" style="font-size:12px">Flaky</div><div class="strong" style="font-size:18px">0</div></div>
      </div>
    </div>
    ${fails.length?`<div class="report-sec">
      <div class="section-title" style="font-size:14px">Root-cause analysis &amp; fix suggestions</div>
      ${fails.map(f=>`<div class="card card-pad" style="margin-bottom:10px">
        <div class="between"><span class="cell-id">${f.case}</span>${tag(f.cat||'Script bug','tag-orange')}</div>
        <div style="font-size:13px;margin:8px 0"><b>Error:</b> <span class="mono" style="color:#cf1322">${esc(f.err||'Assertion failed')}</span></div>
        <div style="font-size:13px;margin-bottom:8px"><b>Root cause:</b> the Sign-In button detaches once the “Account locked” banner renders, so the locator resolves to a stale node. Product behaviour is correct — the <i>test</i> doesn't wait for the post-lockout state.</div>
        <div style="font-size:13px;margin-bottom:6px"><b>Suggested fix</b> (confidence 0.86):</div>
        <pre class="code"><span class="c">// wait for the lockout state before asserting</span>
<span class="k">await</span> page.getByText(<span class="s">'Account locked'</span>).waitFor();
<span class="k">await</span> expect(loginPage.signInButton).toBeHidden();</pre>
      </div>`).join('')}
    </div>`:`<div class="note report-sec"><span>✓</span><div>No failures to diagnose. Recent runs trend: stable.</div></div>`}
    <div class="report-sec">
      <div class="section-title" style="font-size:14px">Recommendations</div>
      <ul style="margin:0 0 0 18px;color:var(--text-2);font-size:13px">
        ${fails.length?`<li>Apply the locator-wait patch and re-run <b>${fails.map(f=>f.case).join(', ')}</b>; open a PR on <span class="mono">fix/login-003-lockout</span>.</li>`:''}
        <li>Promote this plan to the release gate — pass rate is ${rate}%.</li>
        <li>Close coverage gap <span class="cell-id">REQ-AUTH-LOGIN-003</span> with a dedicated lockout case.</li>
      </ul>
    </div>`;
  openModalWide('✦ AI execution report — '+r.id, body,
    `<button class="btn" data-act="toast" data-msg="Report exported (PDF + JSON)" data-type="success">⤓ Export</button><button class="btn" data-act="toast" data-msg="Report link copied — shareable with the team" data-type="success">Share</button>${fails.length?`<button class="btn btn-primary" data-act="toastClose" data-msg="Repair PR opened on fix/login-003-lockout" data-type="success">✓ Accept fix → open PR</button>`:'<button class="btn btn-primary" data-act="close">Done</button>'}`);
}
function openRun(id){
  const r=DB.runs.find(x=>x.id===id);
  const results=r.results.length?r.results:(r._synth||(r._synth=Array.from({length:r.total},(_,i)=>({case:'CASE-'+(i+1),status:i<r.pass?'pass':(i<r.pass+r.fail?'fail':'skip'),dur:(3+Math.random()*3).toFixed(1)+'s'}))));
  const body=`
    <div class="between" style="margin-bottom:12px">
      <div><div class="cell-id">${r.id}</div><div class="muted" style="margin-top:3px">${r.env} · ${r.started} · ${esc(r.by)}</div></div>
      ${tag(r.status,RUN_TAG[r.status])}
    </div>
    <div class="row" style="gap:8px;margin-bottom:14px">
      <div class="card card-pad" style="flex:1;text-align:center;padding:10px"><div class="muted" style="font-size:12px">Total</div><div class="strong" style="font-size:18px">${r.total}</div></div>
      <div class="card card-pad" style="flex:1;text-align:center;padding:10px;background:#f6ffed"><div class="muted" style="font-size:12px">Passed</div><div class="strong" style="font-size:18px;color:#389e0d">${r.pass}</div></div>
      <div class="card card-pad" style="flex:1;text-align:center;padding:10px;background:${r.fail?'#fff2f0':'#fff'}"><div class="muted" style="font-size:12px">Failed</div><div class="strong" style="font-size:18px;color:#ff4d4f">${r.fail}</div></div>
      <div class="card card-pad" style="flex:1;text-align:center;padding:10px"><div class="muted" style="font-size:12px">Duration</div><div class="strong" style="font-size:18px">${r.dur}</div></div>
    </div>
    <div class="section-title" style="font-size:14px">Per-case results</div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Case</th><th>Status</th><th>Duration</th><th>Artifacts</th></tr></thead>
      <tbody>${results.map(rr=>`
        <tr>
          <td class="cell-id">${rr.case}</td>
          <td>${tag(rr.status,RES_TAG[rr.status])}</td>
          <td class="muted">${rr.dur}</td>
          <td>${rr.status==='fail'?`<a style="cursor:pointer;color:#1677ff" data-act="openFailure" data-a="${r.id}" data-b="${rr.case}">trace · screenshot · analyze →</a>`:rr.status==='pass'?'<span class="muted">trace · video</span>':'<span class="muted">—</span>'}</td>
        </tr>`).join("")}
      </tbody></table></div>`;
  openDrawer("Run detail",body,
    `<button class="btn" data-act="toast" data-msg="Re-running failed cases…" data-type="info">↻ Re-run failed</button><button class="btn btn-primary" data-act="openReport" data-a="${r.id}">✦ AI report</button>`);
}
function openFailure(runId,caseId){
  const r=DB.runs.find(x=>x.id===runId);const rr=r.results.find(x=>x.case===caseId)||{};
  openModal("Failure analysis — "+caseId,`
    <div class="between" style="margin-bottom:10px"><span class="cell-id">${caseId}</span>${tag('fail','tag-red')}</div>
    <dl class="dl">
      <dt>Classification</dt><dd>${tag(rr.cat||'Script bug','tag-orange')} <span class="muted">(distinguishes product bug / script / data / env / flaky)</span></dd>
      <dt>Script</dt><dd class="cell-id">${rr.script||'—'}</dd>
    </dl>
    <div class="section-title" style="font-size:14px;margin-top:14px">Error</div>
    <pre class="code"><span class="c">${esc(rr.err||'Assertion failed')}</span></pre>
    <div class="note purple" style="margin-top:12px"><span>✦</span><div><b>AI repair context (scoped):</b> failed step + error log + relevant locators + code snippet + trace summary + cropped screenshot only. <b>Full HTML / full screenshot excluded.</b> <b>FR-AI-007 · NFR-COST-002</b></div></div>
    <div class="section-title" style="font-size:14px;margin-top:14px">Suggested patch</div>
    <pre class="code"><span class="c">// wait for lockout banner before locating the button</span>
<span class="k">await</span> page.getByText(<span class="s">'Account locked'</span>).waitFor();
<span class="k">await</span> expect(loginPage.signInButton).toBeHidden();</pre>
  `,`<button class="btn" data-act="close">Dismiss</button><button class="btn btn-primary" data-act="toastClose" data-msg="Repair PR opened on fix/login-003-lockout" data-type="success">✓ Accept patch → open PR</button>`);
}

/* ============================================================
   VIEW: COVERAGE DASHBOARD
   ============================================================ */

  const cov=DB.coverage;
  render(`
  <div class="page-head">
    <div><div class="page-title">Coverage Dashboard</div>
    <div class="page-sub">Multi-dimensional coverage across requirements, pages, features, roles, workflows &amp; historical bugs — plus AI-ranked gaps. <b>FR-COV-001…005</b></div></div>
  </div>
  <div class="row" style="align-items:stretch">
    <div class="card card-pad" style="flex:1;min-width:280px;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div class="ring-wrap"><div class="ring" style="background:conic-gradient(#1677ff 73%,#f5f5f5 0)"><b>73%</b></div></div>

      <div class="section-title">Status breakdown</div>

      <div class="between" style="margin-bottom:6px"><span>${tag('passed','tag-green')}</span><span class="strong">94.2%</span></div>

<span class="f">"type"</span>: <span class="s">"Negative"</span>,

/* ============================================================
   EVENT DELEGATION  (no inline handlers -> sanitizer-safe)
   ============================================================ */
const ACTIONS={
  nav:ds=>{location.hash=ds.a;},
  close:()=>closeOverlays(),
  closeNav:ds=>{closeOverlays();location.hash=ds.a;},
  gotoRunDetail:ds=>{location.hash='runs';setTimeout(()=>openRun(ds.a),80);},
  openCase:ds=>openCase(ds.a),
  openPage:ds=>openPage(ds.a),
  openScript:ds=>openScript(ds.a),
  openRun:ds=>openRun(ds.a),
  openFailure:ds=>openFailure(ds.a,ds.b),
  openImport:()=>openImport(),
  openDedupe:()=>openDedupe(),
  execTab:ds=>{execTab=ds.a;renderExecBody();[...document.querySelectorAll('#execTabs button')].forEach(b=>b.classList.toggle('active',b.dataset.a===ds.a));},
  openNewPlan:()=>openNewPlan(),
  editPlan:ds=>editPlan(ds.a),
  duplicatePlan:ds=>duplicatePlan(ds.a),
  deletePlan:ds=>deletePlan(ds.a),
  deletePlanConfirm:ds=>deletePlanConfirm(ds.a),
  savePlan:()=>savePlan(),
  runPlan:ds=>runPlan(ds.a),
  openReport:ds=>openReport(ds.a),
  openCapture:()=>openCapture(),
  recapture:ds=>recapture(ds.a),
  capMethod:ds=>capMethod(ds.a),
  capStartCapture:()=>capStartCapture(),
  capNext:ds=>capNext(ds.a),
  capBack:ds=>capBack(ds.a),
  capSave:()=>capSave(),
  importDo:()=>{closeOverlays();toast('Imported 40 cases · 2 flagged for review','success');},
  mergeDo:()=>{closeOverlays();toast('Merged into BO-LOGIN-002 · coverage links preserved','success');},
  caseFilter:ds=>{caseFilter=ds.a;renderCaseTable();syncSeg();},
  aiTab:ds=>aiTab(+ds.a),
  runGeneration:()=>runGeneration(),
  acceptAI:()=>acceptAI(),
  recommendGap:ds=>recommendGap(+ds.a),
  gapToAI:ds=>{closeOverlays();location.hash='ai';toast('Loaded gap '+ds.a+' into AI Workspace','info');},
  aiClean:ds=>toast('AI proposed expected results for '+ds.a+' — awaiting your acceptance','info'),
  genFromCase:ds=>{closeOverlays();location.hash='ai';toast('Loaded '+ds.a+' into AI Workspace','info');},
  toast:ds=>toast(ds.msg,ds.type||'info'),
  toastClose:ds=>{closeOverlays();toast(ds.msg,ds.type||'success');}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t)return;
  const fn=ACTIONS[t.dataset.act];
  if(fn){ if(t.tagName==='A'&&!t.getAttribute('href'))e.preventDefault(); fn(t.dataset); }
});
document.addEventListener('input',e=>{
  if(e.target.id==='caseSearchInput'){caseSearch=e.target.value;renderCaseTable();}
});
document.addEventListener('change',e=>{
  if(e.target.id==='productSel'){CURRENT_PRODUCT=e.target.value;route();}
  else if(e.target.id==='planSched'){const o=$("#schedOpts");if(o)o.style.display=e.target.checked?'block':'none';}
  else if(e.target.id==='capLogin'){const o=$("#capAuth");if(o)o.style.display=e.target.checked?'block':'none';}
  else if(e.target.id==='capGenPO'){const o=$("#capPOPreview");if(o)o.style.display=e.target.checked?'block':'none';}
  else if(e.target.dataset && e.target.dataset.ctx!==undefined){aiContext[+e.target.dataset.ctx].on=e.target.checked;renderCtx();}
});

route();
